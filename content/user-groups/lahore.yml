    label: Organizer
    linkedin: https://www.linkedin.com/in/sumamazaeem/
    photo: images/sumama-favicon.png

events:
  - 2025-lahore
  - 2024-lahore
  - 2022-lahore

notes: >
  AWS User Group Lahore does not appear in the User Group logo strip on
  kirothon/index.html, which lists Women in Tech Lahore instead. Whether that
  omission is deliberate is unresolved. The photo referenced above
  (images/sumama-favicon.png) is a 1.97 MB PNG being used as both a favicon and a
  portrait and should be replaced with a properly sized portrait.
  lahore/index.html also still contains unrendered Laravel/Blade placeholders
  ({{$advisorPerson->name}}, {{$speakerPerson->picture}}) and leftover text from
  the template this site descends from; see docs/restructure-plan.md item 2f.

