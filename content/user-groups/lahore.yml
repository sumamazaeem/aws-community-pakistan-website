# role:   lead | co-lead | mentor | organizer | co-organizer | core-team | unspecified

slug: lahore
name: AWS User Group Lahore
city: Lahore
province: Punjab
status: active
logo: images/aws_ug_lahore1.png
page: lahore/index.html

# The social links printed on lahore/index.html are the NATIONAL AWS Community
