name: CloudFront Cache Invalidation

on:
  push:
    branches: [main]

jobs:
  invalidate-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Wait for CodePipeline deployment to succeed
        id: pipeline-check
        run: |
          MAX_ATTEMPTS=20   # 20 x 30s = 10 minutes max wait
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(aws codepipeline get-pipeline-state \
              --name "${{ vars.CODEPIPELINE_NAME }}" \
              --query "stageStates[?stageName=='Deploy'].latestExecution.status" \
              --output text)
            echo "Attempt $((ATTEMPT+1))/$MAX_ATTEMPTS — Pipeline status: $STATUS"
            if [ "$STATUS" = "Succeeded" ]; then
              echo "CodePipeline deployment succeeded."
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Stopped" ] || [ "$STATUS" = "Superseded" ]; then
              echo "CodePipeline ended with non-recoverable status: $STATUS. Aborting invalidation."
              exit 1
            fi
            ATTEMPT=$((ATTEMPT+1))
            echo "Waiting 30s for pipeline to complete..."
            sleep 30
          done
          echo "Timed out after $((MAX_ATTEMPTS * 30))s waiting for CodePipeline to succeed."
          exit 1

      - name: Invalidate CloudFront cache
        id: invalidate
        run: |
          RESULT=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --output json)
          INVALIDATION_ID=$(echo "$RESULT" | jq -r '.Invalidation.Id')
          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

      - name: Report status
        if: always()
        run: |
          if [ "${{ steps.invalidate.outcome }}" == "success" ]; then
            echo "### ✅ CloudFront Invalidation Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "Invalidation ID: ${{ steps.invalidate.outputs.invalidation_id }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ CloudFront Invalidation Failed" >> "$GITHUB_STEP_SUMMARY"
          fi
