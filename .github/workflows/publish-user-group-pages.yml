name: Publish user group pages

# Builds content/user-groups/*.yml and commits the rendered pages to
# user-groups/ in this repository.
#
# WHY A BOT COMMITS THIS: CodePipeline syncs the repository to S3 verbatim with
# no build step, so the generated HTML has to exist in git for the site to serve
# it. Committing build output by hand is how it silently goes stale -- somebody
# edits a YAML record, forgets to rebuild, and the published page disagrees with
# the data it claims to come from. Regenerating it here means the committed
# pages cannot drift from content/.
#
# Edit content/user-groups/*.yml or src/ -- never user-groups/ directly. Any
# hand edit there is overwritten on the next run.

on:
  push:
    branches:
      - 'restructure/**'
    paths:
      - 'content/user-groups/**'
      - 'src/**'
      - 'astro.config.mjs'
      - 'package.json'
      - '.github/workflows/publish-user-group-pages.yml'
  workflow_dispatch:

concurrency:
  group: publish-user-group-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to auto-commit to a protected branch
        run: |
          case "${{ github.ref_name }}" in
            main|master|mainline)
              echo "::error::this job must never commit to ${{ github.ref_name }}"
              exit 1
              ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Mirror the built pages into user-groups/
        run: |
          set -euo pipefail
          test -f dist/user-groups/index.html
          rm -rf user-groups
          mkdir -p user-groups
          cp -R dist/user-groups/. user-groups/
          # A reminder for anyone who finds these files before the README.
          cat > user-groups/.generated <<'EOF'
          Everything in this directory is GENERATED from content/user-groups/*.yml
          by .github/workflows/publish-user-group-pages.yml.

          Do not edit these files. Edit the YAML record instead; the next build
          overwrites anything changed here.
          EOF
          find user-groups -type f | sort

      - name: Commit only if the output actually changed
        run: |
          set -euo pipefail
          git add -A user-groups
          if git diff --cached --quiet; then
            echo "user-groups/ already matches content/ -- nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish user group pages from content/ [skip ci]'
          git push origin "HEAD:${{ github.ref_name }}"
